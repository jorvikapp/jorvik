<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="referrer" content="no-referrer" />
    <!-- Jorvik has its own dark theme. Without this, the Dark Reader add-on recolours it and turns the dark separators light. -->
    <meta name="darkreader-lock" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'none';
        style-src 'self' 'unsafe-inline';
        script-src 'self' 'wasm-unsafe-eval';
        img-src * blob: data:;
        connect-src * blob:;
        font-src 'self' data:;
        media-src * blob: data:;
        child-src * blob: data:;
        worker-src 'self' blob:;
        frame-src * blob: data:;
        form-action 'self';
        manifest-src 'self';
      "
    />
    <title>Jorvik Web</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/branding/jorvik-favicon-848bff6b.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/branding/jorvik-apple-touch-180-3f109092.png" />
    <!-- Lets phones add Jorvik to the Home Screen; iPhones only send push to an app added there. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0e0e10" />
    <meta name="apple-mobile-web-app-title" content="Jorvik" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
