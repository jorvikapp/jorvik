name: Build Jorvik desktop clients

on:
  workflow_dispatch:
    inputs:
      desktop_version:
        description: "Desktop version for this manual validation build"
        required: true
        default: "1.2.8"
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: dist
            artifact: windows
          - name: macOS
            os: macos-latest
            target: dist:mac:universal:unsigned
            artifact: macos
          - name: Linux
            os: ubuntu-latest
            target: dist:linux
            artifact: linux

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set desktop version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "HEOROT_DESKTOP_VERSION=${{ inputs.desktop_version }}" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF_NAME" == v* ]]; then
            echo "HEOROT_DESKTOP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "HEOROT_DESKTOP_VERSION=0.1.0" >> "$GITHUB_ENV"
          fi
      - name: Apply desktop version
        shell: bash
        run: npm --prefix apps/desktop version "$HEOROT_DESKTOP_VERSION" --no-git-tag-version --allow-same-version
      - name: Install Linux packaging tools
        if: matrix.artifact == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @heorot/desktop run ${{ matrix.target }}
      - name: Verify packaged Linux icon
        if: matrix.artifact == 'linux'
        working-directory: apps/desktop
        shell: bash
        run: |
          test -f dist-electron/linux-unpacked/resources/jorvik.png
          appimage=$(find dist-electron -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$appimage"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            test -f "$appimage"
            manual_appimage="dist-electron/Jorvik-${HEOROT_DESKTOP_VERSION}.AppImage"
            if [[ "$appimage" != "$manual_appimage" ]]; then
              cp "$appimage" "$manual_appimage"
            fi
            echo "Manual Linux AppImage: dist-electron/Jorvik-${HEOROT_DESKTOP_VERSION}.AppImage"
          fi
          "$appimage" --appimage-extract >/dev/null
          test -f squashfs-root/resources/jorvik.png
          # The desktop-entry icon is a different file from the runtime resource
          # above. build/ is gitignored, so a missing build/icons makes Electron
          # Builder fall back to its stock icon without failing the build.
          cmp squashfs-root/usr/share/icons/hicolor/256x256/apps/jorvik.png build/icons/256x256.png
          ls -lh dist-electron/*.AppImage
      - name: Verify Linux package set
        if: matrix.artifact == 'linux'
        working-directory: apps/desktop
        shell: bash
        run: |
          for ext in AppImage deb rpm tar.gz snap; do
            found=$(find dist-electron -maxdepth 1 -name "*.${ext}" -print -quit)
            if [[ -z "$found" ]]; then
              echo "::error::no .${ext} produced by dist:linux"
              exit 1
            fi
            echo "$found"
          done
      - name: Publish the snap to the Snap Store
        # Tags only: a manual validation build must not push a revision to
        # users. A missing credential fails the release rather than skipping
        # quietly, because a release that silently does not publish looks
        # identical to one that did.
        if: matrix.artifact == 'linux' && startsWith(github.ref, 'refs/tags/v')
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: apps/desktop/dist-electron/Jorvik-${{ env.HEOROT_DESKTOP_VERSION }}.snap
          release: stable
      - uses: actions/upload-artifact@v4
        with:
          name: jorvik-${{ matrix.artifact }}
          path: apps/desktop/dist-electron/*
          if-no-files-found: error
      - name: Upload manual Linux AppImage
        if: matrix.artifact == 'linux' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: jorvik-linux-appimage-${{ inputs.desktop_version }}
          path: apps/desktop/dist-electron/Jorvik-${{ inputs.desktop_version }}.AppImage
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jorvik-*
          path: release-assets
          merge-multiple: true
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p release-files
          # Everything publishable sits at the artifact root. Skipping the
          # *-unpacked/ trees keeps the loose binaries inside them out of the
          # release: they are what shipped Jorvik.exe (234MB, not an installer)
          # and elevate.exe on every release up to v1.0.5.
          find release-assets -type f ! -path '*-unpacked/*' \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.zip' \
               -o -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*.snap' \) \
            -exec cp {} release-files/ \;
          ls -lh release-files/
          # A layout change upstream must not quietly publish an empty release.
          test -n "$(ls -A release-files)"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Jorvik ${{ github.ref_name }}
          generate_release_notes: true
          files: release-files/*
