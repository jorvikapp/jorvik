name: Build Jorvik desktop clients

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: dist
            artifact: windows
          - name: macOS
            os: macos-latest
            target: dist:mac:universal:unsigned
            artifact: macos
          - name: Linux
            os: ubuntu-latest
            target: dist:linux
            artifact: linux

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set desktop version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            echo "HEOROT_DESKTOP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "HEOROT_DESKTOP_VERSION=0.1.0" >> "$GITHUB_ENV"
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @heorot/desktop run ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: jorvik-${{ matrix.artifact }}
          path: apps/desktop/dist-electron/*
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jorvik-*
          path: release-assets
          merge-multiple: true
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p release-files
          find release-assets -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.zip' \) -exec cp {} release-files/ \;
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Jorvik ${{ github.ref_name }}
          generate_release_notes: true
          files: release-files/*
